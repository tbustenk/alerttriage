name: Tests

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  unit-and-integration:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-api.txt
          pip install -r requirements-analytics.txt
          pip install \
            pytest \
            pytest-asyncio \
            pytest-cov \
            httpx \
            pyyaml

      - name: Run unit tests with coverage
        run: |
          pytest tests/ \
            -m "not load" \
            --cov=alerttriage/src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -v \
            --tb=short
        env:
          ALERTTRIAGE_LOG_LEVEL: WARNING

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: unit-and-integration

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-api.txt
          pip install -r requirements-analytics.txt
          pip install pytest pytest-asyncio

      - name: Run performance benchmarks
        run: |
          pytest tests/performance/ -v --tb=short
        env:
          ALERTTRIAGE_LOG_LEVEL: WARNING

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -r requirements.txt
          pip install -r requirements-api.txt
          pip install -r requirements-analytics.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy alerttriage/src --ignore-missing-imports --no-error-summary
        continue-on-error: true   # type stubs may be incomplete in third-party libs

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Bandit security scan
        run: |
          bandit -r alerttriage/src \
            -x alerttriage/src/tests \
            --severity-level medium \
            --confidence-level medium \
            -f txt
        continue-on-error: true
