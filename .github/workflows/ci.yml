name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Lint & type-check ────────────────────────────────────────────────────
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install ruff mypy

      - name: Install stubs for third-party packages
        run: pip install types-PyYAML types-requests

      - name: Ruff — lint
        run: ruff check alerttriage/ scripts/ tests/

      - name: Ruff — format check
        run: ruff format --check alerttriage/ scripts/ tests/

      - name: Mypy — type check
        run: |
          mypy alerttriage/ \
            --ignore-missing-imports \
            --python-version 3.11 \
            --strict-optional \
            --warn-redundant-casts \
            --warn-unused-ignores \
            --no-error-summary

  # ── Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          # Tests run in dry-run / offline mode — no real API keys required.
          ANTHROPIC_API_KEY: "sk-ant-test-key"
          OPENAI_API_KEY: "sk-test-key"

  # ── Security scan ─────────────────────────────────────────────────────────
  security:
    name: Dependency security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2022-42974
