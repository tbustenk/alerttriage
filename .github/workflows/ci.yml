name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Paths reflect the actual on-disk layout (flat — see docs/ARCHITECTURE.md).
# Imports use the dotted ``alerttriage.src.*`` form; conftest.py at the
# repo root bootstraps sys.path so those imports resolve from the checkout dir.

jobs:
  # ── Lint & type-check ────────────────────────────────────────────────────
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install ruff mypy

      - name: Install stubs for third-party packages
        run: pip install types-PyYAML types-requests

      - name: Ruff — lint
        run: ruff check src/ scripts/ tests/ config/

      - name: Ruff — format check
        run: ruff format --check src/ scripts/ tests/ config/

      - name: Mypy — type check
        run: |
          mypy src/ config/ \
            --ignore-missing-imports \
            --python-version 3.11 \
            --strict-optional \
            --warn-redundant-casts \
            --warn-unused-ignores \
            --no-error-summary

  # ── Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        # conftest.py at the repo root puts the parent dir on sys.path
        # so the dotted ``alerttriage.*`` imports resolve.
        run: pytest tests/ -v --tb=short
        env:
          ANTHROPIC_API_KEY: "sk-ant-test-key"
          OPENAI_API_KEY: "sk-test-key"

  # ── Security scan ─────────────────────────────────────────────────────────
  security:
    name: Dependency security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2022-42974
