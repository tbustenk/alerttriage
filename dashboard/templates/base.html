<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AlertTriage{% endblock %} — {{ client_id }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<nav class="navbar">
  <div class="nav-brand">
    <span class="brand-icon">⚡</span>
    AlertTriage
    <span class="client-badge">{{ client_id }}</span>
  </div>

  <button class="nav-hamburger" id="nav-toggle" aria-label="Menu">☰</button>

  <ul class="nav-links">
    <li><a href="/"         {% if request.endpoint == 'dashboard'     %}class="active"{% endif %}>Dashboard</a></li>
    <li><a href="/alerts"   {% if request.endpoint == 'alerts_page'   %}class="active"{% endif %}>Alerts</a></li>
    <li><a href="/learning" {% if request.endpoint == 'learning_page' %}class="active"{% endif %}>Learning</a></li>
    <li><a href="/feedback" {% if request.endpoint == 'feedback_page' %}class="active"{% endif %}>Feedback</a></li>
    <li><a href="/admin"         {% if request.endpoint == 'admin_page'         %}class="active"{% endif %}>Admin</a></li>
    <li><a href="/analytics"     {% if request.endpoint == 'analytics_page'     %}class="active"{% endif %}>Analytics</a></li>
    <li><a href="/config-editor" {% if request.endpoint == 'config_editor_page' %}class="active"{% endif %}>Config</a></li>
    <li><a href="/webhooks-mgmt" {% if request.endpoint == 'webhooks_page'      %}class="active"{% endif %}>Webhooks</a></li>
  </ul>

  <div class="nav-meta">
    <span id="last-updated"></span>
    <span class="refresh-dot" id="refresh-dot">●</span>
  </div>
</nav>

<main class="content">
  {% block content %}{% endblock %}
</main>

<script src="{{ url_for('static', filename='charts.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
