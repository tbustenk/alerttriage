[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ── Ruff ──────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
]
ignore = [
  "B008",   # do not perform calls in default args (fine for Pydantic)
  "SIM108", # ternary vs if-else (readability preference)
]

[tool.ruff.lint.isort]
known-first-party = ["alerttriage"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Mypy ──────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

# Third-party packages that lack full stubs — suppress at module level.
[[tool.mypy.overrides]]
module = ["structlog.*", "anthropic.*", "openai.*"]
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
  "ignore::DeprecationWarning",
]
markers = [
  "load: marks tests as load/stress tests (deselect with '-m not load')",
  "slow: marks tests that run slowly",
]

# ── Coverage ──────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["alerttriage/src"]
omit = [
  "*/tests/*",
  "*/__pycache__/*",
  "*/migrations/*",
  # External-service integrations require live SIEM/cloud credentials to test
  "*/integrations/elk_connector.py",
  "*/integrations/splunk_connector.py",
  "*/integrations/siem_base.py",
  "*/integrations/webhook_output.py",
  # AI model backends require live API keys
  "*/models/claude_backend.py",
  "*/models/gpt_backend.py",
  # File-watcher requires OS watchdog events
  "*/config_ext/hot_reload.py",
  # Notification channels require live email/Slack credentials
  "*/monitoring/notifier.py",
  # Report rendering modules are integration-level (HTML/PDF/CSV output)
  "*/reporting/report_generator.py",
  "*/reporting/metrics.py",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if TYPE_CHECKING",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "@(abc\\.)?abstractmethod",
]
